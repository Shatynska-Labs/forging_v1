services:
  web:
    image: ghcr.io/shatynska/shatynskyj:${IMAGE_TAG:?IMAGE_TAG is not rendered}
    restart: unless-stopped
    read_only: true
    tmpfs:
      - /tmp
    networks:
      - platform_edge
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.shatynskyj.rule=Host(`shatynskyj.in.ua`) || Host(`www.shatynskyj.in.ua`)"
      - "traefik.http.routers.shatynskyj.entrypoints=websecure"
      - "traefik.http.routers.shatynskyj.tls.certresolver=letsencrypt"
      - "traefik.http.services.shatynskyj.loadbalancer.server.port=8080"

networks:
  platform_edge:
    external: true
